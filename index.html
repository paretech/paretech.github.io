<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paretech — Game of Life</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: rgb(200, 217, 120);
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: rgb(200, 217, 120);
      image-rendering: auto;
    }
  
    .brand {
      position: fixed;
      left: clamp(22px, 4vw, 56px);
      top: clamp(22px, 4vw, 48px);
      color: rgba(24, 36, 10, 0.96);
      font-family: Monaco, "Courier New", monospace;
      letter-spacing: -0.05em;
      text-shadow:
        0 2px 0 rgba(235, 244, 160, 0.85),
        0 0 18px rgba(235, 244, 160, 0.28);
      user-select: none;
      pointer-events: none;
      padding: 18px 22px 16px 20px;
      background: linear-gradient(
        180deg,
        rgba(217, 231, 132, 0.84),
        rgba(187, 206, 96, 0.72)
      );
      border: 2px solid rgba(40, 56, 16, 0.72);
      box-shadow:
        6px 6px 0 rgba(78, 98, 31, 0.22),
        inset 2px 2px 0 rgba(244, 250, 190, 0.45);
      backdrop-filter: blur(2px);
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 2px solid rgba(35, 52, 17, 0.76);
      background: rgba(213, 229, 121, 0.42);
      box-shadow:
        3px 3px 0 rgba(70, 92, 28, 0.20),
        inset 2px 2px 0 rgba(243, 250, 166, 0.24);
    }

    .brand-mark::before {
      content: "P";
      font-size: 28px;
      font-weight: 900;
      line-height: 1;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(32px, 5.4vw, 72px);
      line-height: 0.92;
      font-weight: 900;
      color: rgba(21, 31, 9, 0.98);
    }

    .brand p {
      margin: 10px 0 0 60px;
      font-size: clamp(13px, 1.35vw, 18px);
      font-weight: 700;
      letter-spacing: -0.03em;
      opacity: 0.92;
      color: rgba(32, 44, 14, 0.88);
    }

    .footer-link {
      position: fixed;
      right: clamp(18px, 3vw, 42px);
      bottom: clamp(18px, 3vw, 36px);
      color: rgba(24, 36, 10, 0.96);
      font-family: Monaco, "Courier New", monospace;
      font-size: 15px;
      font-weight: 800;
      text-decoration: none;
      letter-spacing: -0.04em;
      padding: 11px 14px;
      border: 2px solid rgba(40, 56, 16, 0.76);
      background: linear-gradient(
        180deg,
        rgba(219, 233, 136, 0.92),
        rgba(189, 208, 98, 0.82)
      );
      box-shadow:
        5px 5px 0 rgba(70, 92, 28, 0.24),
        inset 2px 2px 0 rgba(243, 250, 166, 0.34);
    }

    .footer-link:hover {
      transform: translate(1px, 1px);
      box-shadow:
        3px 3px 0 rgba(70, 92, 28, 0.22),
        inset 2px 2px 0 rgba(243, 250, 166, 0.24);
    }

    @media (max-width: 640px) {
      .brand p { margin-left: 0; }
      .brand-mark { width: 36px; height: 36px; }
      .brand-mark::before { font-size: 23px; }
    }
  </style>
</head>
<body>
  <canvas id="life"></canvas>

  <header class="brand" aria-label="Paretech">
    <div class="brand-row">
      <!-- <div class="brand-mark" aria-hidden="true"></div> -->
      <h1>paretech.com</h1>
    </div>
    <!-- <p>living documents · useful tools · simple systems</p> -->
  </header>

  <a class="footer-link" href="https://docs.paretech.com">docs →</a>

  <script>
    const canvas = document.getElementById("life");
    const ctx = canvas.getContext("2d", { alpha: false });

    const cfg = {
      background: "rgb(200, 217, 120)",
      cols: 120,
      rows: 86,
      stepMs: 115,
      angleDeg: -8,
      perspective: 0.10,       // lower = more head-on
      boardScale: 1.23,        // overscan so rotated plane fills canvas
      gapRatio: 0.18,
      seedDensity: 0.13,
    };

    const state = {
      dpr: 1,
      w: 0,
      h: 0,
      grid: [],
      next: [],
      lastStep: 0,
      frame: 0,
      reducedMotion: window.matchMedia("(prefers-reduced-motion: reduce)").matches,
    };

    function resize() {
      state.dpr = Math.min(window.devicePixelRatio || 1, 2);
      state.w = Math.floor(window.innerWidth * state.dpr);
      state.h = Math.floor(window.innerHeight * state.dpr);
      canvas.width = state.w;
      canvas.height = state.h;
      ctx.imageSmoothingEnabled = true;
    }

    function makeGrid() {
      state.grid = Array.from({ length: cfg.rows }, () => Array(cfg.cols).fill(0));
      state.next = Array.from({ length: cfg.rows }, () => Array(cfg.cols).fill(0));

      for (let y = 0; y < cfg.rows; y++) {
        for (let x = 0; x < cfg.cols; x++) {
          state.grid[y][x] = Math.random() < cfg.seedDensity ? 1 : 0;
        }
      }

      // Seed a few stable and oscillating motifs so the first view feels intentional.
      for (let i = 0; i < 24; i++) {
        const x = Math.floor(6 + Math.random() * (cfg.cols - 12));
        const y = Math.floor(6 + Math.random() * (cfg.rows - 12));
        const pick = i % 5;
        if (pick === 0) addGlider(x, y);
        if (pick === 1) addBlinker(x, y);
        if (pick === 2) addBlock(x, y);
        if (pick === 3) addBeacon(x, y);
        if (pick === 4) addToad(x, y);
      }
    }

    function setCell(x, y, value = 1) {
      if (x >= 0 && x < cfg.cols && y >= 0 && y < cfg.rows) {
        state.grid[y][x] = value;
      }
    }

    function addGlider(x, y) {
      [[1,0],[2,1],[0,2],[1,2],[2,2]].forEach(([dx, dy]) => setCell(x + dx, y + dy));
    }

    function addBlinker(x, y) {
      [[0,0],[1,0],[2,0]].forEach(([dx, dy]) => setCell(x + dx, y + dy));
    }

    function addBlock(x, y) {
      [[0,0],[1,0],[0,1],[1,1]].forEach(([dx, dy]) => setCell(x + dx, y + dy));
    }

    function addBeacon(x, y) {
      [[0,0],[1,0],[0,1],[3,2],[2,3],[3,3]].forEach(([dx, dy]) => setCell(x + dx, y + dy));
    }

    function addToad(x, y) {
      [[1,0],[2,0],[3,0],[0,1],[1,1],[2,1]].forEach(([dx, dy]) => setCell(x + dx, y + dy));
    }

    function countNeighbors(x, y) {
      let n = 0;
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          if (dx === 0 && dy === 0) continue;
          const xx = (x + dx + cfg.cols) % cfg.cols;
          const yy = (y + dy + cfg.rows) % cfg.rows;
          n += state.grid[yy][xx];
        }
      }
      return n;
    }

    function stepLife() {
      for (let y = 0; y < cfg.rows; y++) {
        for (let x = 0; x < cfg.cols; x++) {
          const alive = state.grid[y][x];
          const n = countNeighbors(x, y);
          state.next[y][x] = alive ? (n === 2 || n === 3 ? 1 : 0) : (n === 3 ? 1 : 0);
        }
      }
      [state.grid, state.next] = [state.next, state.grid];

      // Gentle reseeding keeps a landing page alive without looking too chaotic.
      if (state.frame % 700 === 0) {
        addGlider(
          Math.floor(8 + Math.random() * (cfg.cols - 16)),
          Math.floor(8 + Math.random() * (cfg.rows - 16))
        );
      }
    }

    function setupTransform() {
      const minDim = Math.min(state.w, state.h);
      const cell = (Math.max(state.w / cfg.cols, state.h / cfg.rows) * cfg.boardScale);
      const boardW = cfg.cols * cell;
      const boardH = cfg.rows * cell;
      const angle = cfg.angleDeg * Math.PI / 180;

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.translate(state.w / 2, state.h / 2);
      ctx.rotate(angle);

      // Mild head-on perspective: top rows are slightly compressed and shifted.
      // Canvas 2D cannot do true projective transforms cheaply, so this is applied
      // per-row during drawing instead of via transform matrix.
      return { cell, boardW, boardH, minDim };
    }

    function rowPerspective(y, cell) {
      const normalized = (y / cfg.rows) - 0.5;
      const scale = 1 + normalized * cfg.perspective;
      const yOffset = normalized * normalized * cell * 5.0;
      return { scale, yOffset };
    }

    function drawBackground() {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = cfg.background;
      ctx.fillRect(0, 0, state.w, state.h);

      // Subtle transparent-to-black layer to imply a sheet/plane on a desk.
      const g = ctx.createLinearGradient(0, 0, state.w, state.h);
      g.addColorStop(0.00, "rgba(255,255,255,0.07)");
      g.addColorStop(0.33, "rgba(255,255,255,0.015)");
      g.addColorStop(0.76, "rgba(0,0,0,0.045)");
      g.addColorStop(1.00, "rgba(0,0,0,0.10)");
      ctx.fillStyle = g;
      ctx.globalAlpha = 0.9;
      ctx.fillRect(0, 0, state.w, state.h);
      ctx.globalAlpha = 1;
    }

    function drawGridAndCells() {
      const { cell, boardW, boardH } = setupTransform();
      const gap = cell * cfg.gapRatio;
      const pixel = Math.max(1.2 * state.dpr, cell - gap);
      const originX = -boardW / 2;
      const originY = -boardH / 2;

      // LCD substrate: extremely subtle checker/scan feel.
      ctx.save();
      ctx.globalAlpha = 0.16;
      ctx.strokeStyle = "rgba(80, 105, 35, 0.45)";
      ctx.lineWidth = Math.max(0.5, state.dpr * 0.45);
      for (let y = 0; y <= cfg.rows; y++) {
        const rp = rowPerspective(y, cell);
        const yy = originY + y * cell + rp.yOffset;
        ctx.beginPath();
        ctx.moveTo(originX * rp.scale, yy);
        ctx.lineTo(-originX * rp.scale, yy);
        ctx.stroke();
      }
      for (let x = 0; x <= cfg.cols; x++) {
        ctx.beginPath();
        for (let y = 0; y <= cfg.rows; y += 2) {
          const rp = rowPerspective(y, cell);
          const xx = (originX + x * cell) * rp.scale;
          const yy = originY + y * cell + rp.yOffset;
          if (y === 0) ctx.moveTo(xx, yy);
          else ctx.lineTo(xx, yy);
        }
        ctx.stroke();
      }
      ctx.restore();

      // Dead-cell ghost pixels give the whole surface a calculator LCD matrix look.
      ctx.save();
      for (let y = 0; y < cfg.rows; y++) {
        const rp = rowPerspective(y, cell);
        for (let x = 0; x < cfg.cols; x++) {
          const xx = (originX + x * cell + gap / 2) * rp.scale;
          const yy = originY + y * cell + gap / 2 + rp.yOffset;
          const size = pixel * rp.scale;

          ctx.fillStyle = "rgba(130, 157, 49, 0.13)";
          ctx.fillRect(xx, yy, size, size);
        }
      }
      ctx.restore();

      // Live cells: flat LCD squares with tiny gaps and faint drop shadows.
      ctx.save();
      for (let y = 0; y < cfg.rows; y++) {
        const rp = rowPerspective(y, cell);
        for (let x = 0; x < cfg.cols; x++) {
          if (!state.grid[y][x]) continue;

          const xx = (originX + x * cell + gap / 2) * rp.scale;
          const yy = originY + y * cell + gap / 2 + rp.yOffset;
          const size = pixel * rp.scale;
          const shadow = Math.max(1, 2.4 * state.dpr * rp.scale);

          ctx.fillStyle = "rgba(54, 75, 22, 0.20)";
          ctx.fillRect(xx + shadow, yy + shadow, size, size);

          const lg = ctx.createLinearGradient(xx, yy, xx + size, yy + size);
          lg.addColorStop(0, "rgba(102, 132, 35, 0.95)");
          lg.addColorStop(1, "rgba(64, 89, 26, 0.98)");
          ctx.fillStyle = lg;
          ctx.fillRect(xx, yy, size, size);

          // Tiny top-left highlight, like a molded LCD segment catching light.
          ctx.fillStyle = "rgba(214, 231, 125, 0.22)";
          ctx.fillRect(xx + size * 0.12, yy + size * 0.10, size * 0.34, Math.max(1, size * 0.10));
        }
      }
      ctx.restore();
    }

    function drawTexture() {
      ctx.setTransform(1, 0, 0, 1, 0, 0);

      // Very subtle Susan-Kare-era / printed-display texture: square, quiet, not noisy.
      ctx.globalAlpha = 0.055;
      ctx.fillStyle = "rgb(70, 88, 28)";
      const step = 6 * state.dpr;
      for (let y = 0; y < state.h; y += step) {
        for (let x = (Math.floor(y / step) % 2) * step; x < state.w; x += step * 2) {
          ctx.fillRect(x, y, state.dpr, state.dpr);
        }
      }
      ctx.globalAlpha = 1;

      // Edge falloff.
      const v = ctx.createRadialGradient(
        state.w * 0.5, state.h * 0.5, Math.min(state.w, state.h) * 0.20,
        state.w * 0.5, state.h * 0.5, Math.max(state.w, state.h) * 0.66
      );
      v.addColorStop(0, "rgba(255,255,255,0)");
      v.addColorStop(1, "rgba(42,55,16,0.15)");
      ctx.fillStyle = v;
      ctx.fillRect(0, 0, state.w, state.h);
    }

    function draw() {
      drawBackground();
      drawGridAndCells();
      drawTexture();
    }

    function loop(timestamp) {
      state.frame++;
      if (!state.reducedMotion && timestamp - state.lastStep > cfg.stepMs) {
        stepLife();
        state.lastStep = timestamp;
      }
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener("resize", resize);
    resize();
    makeGrid();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
